<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>The Kings Cheats | Admin</title>
<style>
  :root { --bg: #0a0a0c; --card: #141419; --border: #2a2a35; --text: #e2e2e8; --gold: #ffd700; --red: #ff4444; --green: #00c851; --blue: #3b82f6; }
  .light-mode { --bg: #f0f2f5; --card: #ffffff; --border: #d1d5db; --text: #1f2937; --gold: #b8860b; }
  * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; transition: background 0.3s, color 0.3s; }
  body { background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
  
  .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; }
  .header h1 { margin: 0; color: var(--gold); font-size: 28px; }
  .header-right { display: flex; gap: 10px; align-items: center; }
  .btn-theme { background: #333; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
  .logout-btn { background: var(--red); color: white; text-decoration: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; font-size: 13px; }

  .stats-container { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat-box { background: var(--card); border: 1px solid var(--border); padding: 15px; border-radius: 10px; flex: 1; text-align: center; }
  .stat-box h3 { margin: 0 0 5px 0; color: #888; font-size: 12px; }
  .stat-box p { margin: 0; font-size: 24px; font-weight: bold; color: var(--gold); }

  .container { display: flex; gap: 20px; flex-wrap: wrap; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; flex: 1; min-width: 300px; }
  h3 { margin-top: 0; color: var(--gold); border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  
  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: 12px; color: #888; margin-bottom: 4px; }
  input, select { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 6px; }
  button.btn-main { background: var(--gold); color: #000; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; }
  
  .filters { display: flex; gap: 5px; margin-bottom: 15px; flex-wrap: wrap; }
  .filter-btn { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .filter-btn.active { background: var(--gold); color: #000; border-color: var(--gold); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border); }
  th { color: var(--gold); font-size: 11px; text-transform: uppercase; }
  
  .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
  .badge.active { background: rgba(0, 200, 81, 0.2); color: var(--green); }
  .badge.off { background: rgba(255, 68, 68, 0.2); color: var(--red); }
  .badge.warning { background: rgba(255, 215, 0, 0.2); color: var(--gold); }
  
  .btn-small { padding: 5px 8px; font-size: 11px; width: auto; margin-right: 4px; border-radius: 4px; font-weight: bold; cursor: pointer; border: none; }
  .btn-danger { background: var(--red); color: white; }
  .btn-blue { background: var(--blue); color: white; }
  .btn-gray { background: #333; color: white; }

  .key-display { background: var(--bg); padding: 15px; border-radius: 6px; text-align: center; color: var(--gold); font-family: monospace; font-size: 18px; border: 1px dashed var(--gold); margin-top: 15px; display: none; }
  
  /* Modales y Alertas */
  .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; }
  .modal-content { background: var(--card); padding: 25px; border-radius: 10px; width: 400px; border: 1px solid var(--border); }
  .modal-content h4 { margin-top: 0; color: var(--gold); }
  .modal-actions { display: flex; gap: 10px; margin-top: 15px; }

  #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 999; display: flex; flex-direction: column; gap: 10px; }
  .toast { padding: 12px 20px; border-radius: 8px; color: white; font-weight: bold; font-size: 14px; opacity: 0; transform: translateY(20px); transition: 0.3s; }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.success { background: var(--green); }
  .toast.error { background: var(--red); }

  .switch { position: relative; display: inline-block; width: 34px; height: 20px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 20px; }
  .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
  input:checked + .slider { background-color: var(--gold); }
  input:checked + .slider:before { transform: translateX(14px); }
</style>
</head>
<body>

<div class="header">
  <h1>👑 THE KINGS CHEATS</h1>
  <div class="header-right">
    <div style="display:flex; align-items:center; gap:8px; font-size:12px; font-weight:bold;">
      Mantenimiento: 
      <label class="switch"><input type="checkbox" id="maintenanceToggle" onchange="toggleMaintenance()"><span class="slider"></span></label>
    </div>
    <button class="btn-theme" onclick="toggleTheme()">🌓 Tema</button>
    <a href="/logout" class="logout-btn">Salir</a>
  </div>
</div>

<div class="stats-container">
  <div class="stat-box"><h3>Total Clientes</h3><p id="stat-total">0</p></div>
  <div class="stat-box"><h3>Keys Activas</h3><p id="stat-active" style="color: var(--green)">0</p></div>
  <div class="stat-box"><h3>Baneadas</h3><p id="stat-off" style="color: var(--red)">0</p></div>
</div>

<div class="container">
  <div class="card">
    <h3>Crear Nueva Licencia</h3>
    <div class="form-group"><label>Usuario Roblox</label><input id="username" placeholder="Ej: RexTheKing123"></div>
    <div class="form-group"><label>Discord</label><input id="discord" placeholder="Ej: rey#1234"></div>
    <div class="form-group"><label>Key Personalizada</label><input id="custom_key" placeholder="Opcional..."></div>
    <div class="form-group">
      <label>Plan</label>
      <select id="plan">
        <option value="1">1 Día (Prueba)</option><option value="3">3 Días</option>
        <option value="7">7 Días</option><option value="30">30 Días</option>
        <option value="0">Permanente</option>
      </select>
    </div>
    <button class="btn-main" onclick="createKey()">Generar Key</button>
    <div id="keyResult" class="key-display">
      <div style="font-size:12px;color:#888;">KEY GENERADA:</div>
      <span id="newKeyText"></span>
    </div>
  </div>

  <div class="card" style="flex: 2;">
    <h3>Base de Datos</h3>
    <div style="display:flex; gap:10px; margin-bottom:10px;">
      <input type="text" id="searchInput" placeholder="🔍 Buscar por usuario o key..." onkeyup="renderTable()" style="flex:1;">
    </div>
    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('all', this)">Todas</button>
      <button class="filter-btn" onclick="setFilter('active', this)">Activas</button>
      <button class="filter-btn" onclick="setFilter('off', this)">Baneadas</button>
      <button class="filter-btn" onclick="setFilter('warning', this)">Por Vencer</button>
    </div>
    <div style="overflow-x: auto;">
      <table>
        <thead><tr><th>Usuario</th><th>Key</th><th>Tiempo</th><th>Último Uso</th><th>Estado</th><th>Acciones</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modales -->
<div class="modal" id="modalAction">
  <div class="modal-content">
    <h4 id="modalTitle">Acción</h4>
    <div class="form-group"><input type="hidden" id="actionKey"><input id="actionMsg" placeholder="Escribe el mensaje aquí..."></div>
    <div class="modal-actions">
      <button class="btn-small btn-blue" style="padding:10px 15px; font-size:14px;" onclick="confirmAction()">Confirmar</button>
      <button class="btn-small btn-gray" style="padding:10px 15px; font-size:14px;" onclick="document.getElementById('modalAction').style.display='none'">Cancelar</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script>
let allKeys = {};
let currentFilter = 'all';
let currentActionType = '';

// Tema
if (localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');
function toggleTheme() {
  document.body.classList.toggle('light-mode');
  localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
}

// Notificaciones
function showToast(msg, type = 'success') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => toast.classList.add('show'), 100);
  setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3000);
}

// Cargar datos
async function loadKeys() {
  const res = await fetch('/api/keys');
  allKeys = await res.json();
  renderTable();
}

function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTable();
}

function renderTable() {
  const tbody = document.getElementById('tbody'); tbody.innerHTML = '';
  const search = document.getElementById('searchInput').value.toLowerCase();
  
  let statTotal = 0, statActive = 0, statOff = 0;
  for (const k in allKeys) { statTotal++; if (allKeys[k].active) statActive++; else statOff++; }
  document.getElementById('stat-total').textContent = statTotal;
  document.getElementById('stat-active').textContent = statActive;
  document.getElementById('stat-off').textContent = statOff;

  const entries = Object.entries(allKeys).filter(([k, i]) => {
    if (search && !k.toLowerCase().includes(search) && !(i.user_roblox||'').toLowerCase().includes(search)) return false;
    
    const exp = i.expires_at ? new Date(i.expires_at) : null;
    const now = new Date();
    const isExpired = exp && exp < now;
    const isWarning = exp && !isExpired && (exp - now) < 86400000;
    
    if (currentFilter === 'active') return i.active;
    if (currentFilter === 'off') return !i.active;
    if (currentFilter === 'warning') return isWarning;
    return true;
  });

  if (entries.length === 0) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center">No hay resultados</td></tr>'; return; }
  
  for (const [key, info] of entries) {
    let timeLeft = "Permanente", timeClass = "active";
    if (info.expires_at) {
      const exp = new Date(info.expires_at), now = new Date();
      if (exp < now) { timeLeft = "Expirada"; timeClass = "off"; }
      else {
        const diff = exp - now, d = Math.floor(diff/86400000), h = Math.floor((diff%86400000)/3600000);
        timeLeft = `${d}d ${h}h`;
        if (d === 0) timeClass = "warning";
      }
    }
    let lastUsed = "Nunca";
    if (info.last_used) { const d = new Date(info.last_used); lastUsed = `${d.getDate()}/${d.getMonth()+1} ${d.getHours()}:${d.getMinutes()}`; }

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${info.user_roblox}</td>
      <td><span style="font-family:monospace; color:var(--gold); cursor:pointer;" onclick="navigator.clipboard.writeText('${key}'); showToast('Key copiada')">${key}</span></td>
      <td><span class="badge ${timeClass}">${timeLeft}</span></td>
      <td style="font-size:11px; color:#888">${lastUsed}</td>
      <td><span class="badge ${info.active?'active':'off'}">${info.active?'ACTIVA':'OFF'}</span><br><small style="color:#888">${info.admin_note||''}</small></td>
      <td>
        ${info.active ? `<button class="btn-small btn-danger" onclick="openAction('ban','${key}','Motivo del ban...')">Ban</button>` : `<button class="btn-small btn-main" style="color:white; background:var(--green)" onclick="toggleKey('${key}', true)">Activar</button>`}
        <button class="btn-small btn-blue" onclick="openAction('extend','${key}','7')">+Días</button>
        <button class="btn-small btn-gray" onclick="openAction('warn','${key}','Advertencia...')">Aviso</button>
        <button class="btn-small btn-gray" onclick="openAction('note','${key}','${(info.admin_note||'').replace(/'/g, "\\'")}')">Nota</button>
        <button class="btn-small btn-danger" onclick="deleteKey('${key}')">X</button>
      </td>`;
    tbody.appendChild(tr);
  }
}

async function createKey() {
  const user = document.getElementById('username').value;
  if (!user) return showToast("Falta el usuario", "error");
  const res = await fetch('/api/keys/create', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ user_roblox: user, user_discord: document.getElementById('discord').value, days: parseInt(document.getElementById('plan').value), custom_key: document.getElementById('custom_key').value }) });
  const data = await res.json();
  if (data.error) return showToast(data.error, "error");
  document.getElementById('newKeyText').textContent = data.key;
  document.getElementById('keyResult').style.display = 'block';
  document.getElementById('username').value = '';
  showToast("Key creada con éxito");
  loadKeys();
}

function openAction(type, key, placeholder) {
  currentActionType = type;
  document.getElementById('actionKey').value = key;
  const msgInput = document.getElementById('actionMsg');
  msgInput.value = (type === 'extend') ? '7' : '';
  msgInput.placeholder = placeholder;
  document.getElementById('modalTitle').textContent = { ban: "Banear", warn: "Enviar Advertencia", extend: "Extender Días", note: "Nota Privada" }[type];
  document.getElementById('modalAction').style.display = 'flex';
}

async function confirmAction() {
  const key = document.getElementById('actionKey').value;
  const val = document.getElementById('actionMsg').value;
  let url = '', body = {};

  if (currentActionType === 'ban') { url = `/api/keys/${key}/toggle`; body = { active: false, message: val }; }
  else if (currentActionType === 'warn') { url = `/api/keys/${key}/warn`; body = { message: val }; }
  else if (currentActionType === 'extend') { url = `/api/keys/${key}/extend`; body = { days: parseInt(val) || 7 }; }
  else if (currentActionType === 'note') { url = `/api/keys/${key}/note`; body = { note: val }; }

  await fetch(url, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
  document.getElementById('modalAction').style.display = 'none';
  showToast("Acción completada");
  loadKeys();
}

async function toggleKey(key, state) { await fetch(`/api/keys/${key}/toggle`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ active: state }) }); showToast("Actualizado"); loadKeys(); }
async function deleteKey(k) { if(confirm("¿Borrar permanentemente?")) { await fetch(`/api/keys/${k}`, { method: 'DELETE' }); showToast("Eliminada"); loadKeys(); } }
async function toggleMaintenance() { const res = await fetch('/api/maintenance', { method: 'POST' }); const data = await res.json(); showToast(data.status ? "Mantenimiento ON" : "Mantenimiento OFF", data.status ? "error" : "success"); }

loadKeys();
</script>
</body>
</html>
